name: Terraform Deploy

# Só roda manualmente (Actions > Terraform Deploy > Run workflow).
# Precisa dos secrets da nuvem escolhida; veja a seção "Como rodar" do README.
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Nuvem
        type: choice
        options: [aws, azure]
        required: true
      action:
        description: O que fazer
        type: choice
        options: [plan, apply, destroy]
        default: plan
        required: true
      deploy_vms:
        description: Criar as VMs (false = só rede e peering)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.cloud }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_deploy_vms: ${{ inputs.deploy_vms }}

jobs:
  terraform:
    name: ${{ inputs.action }} (${{ inputs.cloud }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/${{ inputs.cloud }}
    env:
      # Azure (service principal). Ignorados quando cloud = aws.
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      # Variáveis das VMs.
      TF_VAR_admin_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_key_name: ${{ vars.AWS_KEY_NAME }}
      TF_VAR_ssh_source_cidr: ${{ vars.SSH_SOURCE_CIDR || (inputs.cloud == 'aws' && '0.0.0.0/0' || '*') }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Credenciais AWS
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # O backend é configurado por -backend-config com valores dos secrets;
      # nada de nome de bucket ou storage account fica no código.
      - name: terraform init (AWS)
        if: inputs.cloud == 'aws'
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: >-
          terraform init
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE"
          -backend-config="key=fiap-iac-cp3/aws/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"

      - name: terraform init (Azure)
        if: inputs.cloud == 'azure'
        env:
          TF_STATE_RESOURCE_GROUP: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
        run: >-
          terraform init
          -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP"
          -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
          -backend-config="container_name=tfstate"
          -backend-config="key=fiap-iac-cp3/azure/terraform.tfstate"

      - run: terraform validate

      - name: terraform plan
        if: inputs.action == 'plan'
        run: terraform plan

      - name: terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output
